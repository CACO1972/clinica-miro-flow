# supabase/config.toml
# Configuración del proyecto Supabase para Clínica Miró

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://clinicamiro.cl"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.external.google]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

# Edge Functions
[functions.analyze-dental]
verify_jwt = true

[functions.create-mercadopago]
verify_jwt = true

[functions.webhook-mercadopago]
verify_jwt = false  # Mercado Pago no envía JWT

[functions.create-dentalink-patient]
verify_jwt = true
